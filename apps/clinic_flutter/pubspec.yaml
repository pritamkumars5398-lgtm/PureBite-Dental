name: clinic_flutter
description: DentalPin offline-first clinic staff app (phone, tablet, desktop).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  dio: ^5.8.0+1
  go_router: ^16.2.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  get_it: ^8.2.0
  drift: ^2.28.1
  path_provider: ^2.1.5
  path: ^1.9.1
  collection: ^1.19.1
  uuid: ^4.5.1
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
